name: AgriCapital Quality Gate

on:
  push:
    branches: [main, Production]
  pull_request:
    branches: [main, Production]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Activate npm 12
        run: npm install --global npm@12.2.0 && npm --version
      - name: Install CRM dependencies
        working-directory: apps/crm
        run: npm install
      - name: Typecheck CRM
        working-directory: apps/crm
        run: npm run typecheck
      - name: Lint CRM
        working-directory: apps/crm
        run: npm run lint
      - name: Build CRM
        working-directory: apps/crm
        run: npm run build
