name: NodeJS with Vite

on:
  push:
    branches: [ "main", "Production" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 24.x

    - name: Install CRM dependencies
      working-directory: apps/crm
      run: npm install

    - name: Build CRM
      working-directory: apps/crm
      run: npm run build

    - name: Typecheck CRM
      working-directory: apps/crm
      run: npm run typecheck

    - name: Lint CRM
      working-directory: apps/crm
      run: npm run lint

    - name: Tests
      working-directory: apps/crm
      run: npx vitest run
