name: NodeJS with Vite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.22

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build
      run: |
        set -o pipefail
        bun run build 2>&1 | tee build-error.log

    - name: Publish build log to PR for diagnosis
      if: ${{ failure() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh pr comment ${{ github.event.pull_request.number }} --body-file build-error.log

    - name: Typecheck
      run: bun run typecheck

    - name: Lint
      run: bun run lint

    - name: Tests
      run: bun run vitest run
