name: NodeJS with Vite

permissions:
  contents: read
  issues: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.2.22

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build
      run: |
        set -o pipefail
        bun run build 2>&1 | tee build-error.log

    - name: Publish build log to PR for diagnosis
      if: ${{ failure() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        jq -Rs '{body: .}' build-error.log > comment.json
        curl -sS -X POST "https://api.github.com/repos/${{ github.repository }}/issues/1/comments" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          --data-binary @comment.json

    - name: Upload build log artifact
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: agricapital-build-log
        path: build-error.log
        if-no-files-found: warn

    - name: Typecheck
      run: bun run typecheck

    - name: Lint
      run: bun run lint

    - name: Tests
      run: bun run vitest run
